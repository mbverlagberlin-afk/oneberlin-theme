name: Theme-ZIP bauen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: theme.json prüfen
        run: python3 -m json.tool theme.json > /dev/null

      - name: Version aus style.css lesen
        id: ver
        run: echo "version=$(grep -m1 -E '^Version:' style.css | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: ZIP erstellen
        run: |
          mkdir -p build/oneberlin
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude '.gitignore' ./ build/oneberlin/
          cd build && zip -r oneberlin.zip oneberlin

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: oneberlin-theme
          path: build/oneberlin.zip

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OneBerlin ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/oneberlin.zip
          make_latest: true
