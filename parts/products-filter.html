<script>
(function(){
function init(){
var box=document.querySelector('.ogs-cat-box');if(!box||box.dataset.ogs)return;
var items=box.querySelectorAll('li');if(!items.length)return;box.dataset.ogs='1';
var path=location.pathname.replace(/\/$/,'');
items.forEach(function(li){
var sub=null;for(var i=0;i<li.children.length;i++){if(li.children[i].tagName==='UL')sub=li.children[i];}
var a=li.querySelector(':scope>a');
if(a){try{if(new URL(a.href).pathname.replace(/\/$/,'')===path){li.classList.add('ogs-cur');var p=li.parentElement;while(p&&p!==box){if(p.tagName==='LI')p.classList.add('ogs-open');p=p.parentElement;}li.classList.add('ogs-open');}}catch(e){}}
if(sub){var b=document.createElement('button');b.type='button';b.className='ogs-tg';b.setAttribute('aria-label','Unterkategorien ein- oder ausklappen');
b.textContent=li.classList.contains('ogs-open')?'−':'+';
b.addEventListener('click',function(){var o=li.classList.toggle('ogs-open');b.textContent=o?'−':'+';});
li.insertBefore(b,sub);}
});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
setTimeout(init,800);
})();
</script>
