<!-- wp:html -->
<div id="ogs-inf-status" style="text-align:center;padding:24px;color:#6C727F;font-size:14px"></div>
<script>
(function(){
  var list=document.querySelector('.wp-block-woocommerce-product-template');
  if(!list)return;
  var pag=document.querySelector('.wp-block-query-pagination');
  var status=document.getElementById('ogs-inf-status');
  function nextUrl(root){var a=root.querySelector('.wp-block-query-pagination-next');return a?a.getAttribute('href'):null;}
  var next=nextUrl(document);
  if(!next){return;}
  if(pag)pag.style.display='none';
  var loading=false;
  function load(){
    if(loading||!next)return;
    loading=true;
    status.textContent='Weitere Produkte werden geladen …';
    fetch(next,{credentials:'same-origin'}).then(function(r){return r.text();}).then(function(t){
      var d=new DOMParser().parseFromString(t,'text/html');
      var nl=d.querySelector('.wp-block-woocommerce-product-template');
      if(nl){Array.prototype.slice.call(nl.children).forEach(function(li){list.appendChild(document.importNode(li,true));});}
      next=nextUrl(d);
      loading=false;
      status.textContent=next?'':'Alle Produkte dieser Kategorie sind geladen.';
      if(next)check();
    }).catch(function(){loading=false;status.innerHTML='<a href="'+next+'">Nächste Seite</a>';});
  }
  function check(){
    var r=status.getBoundingClientRect();
    if(r.top<window.innerHeight+1200)load();
  }
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check);
  check();
})();
</script>
